name: sonar

on:
  workflow_call:
    inputs:
      node:
        description: 'Node version'
        default: '24'
        required: false
        type: string  
      artifact:
        description: 'Name of the artifact for the build'
        default: 'package'
        required: false
        type: string   
      artifactPath:
        description: 'Artifact path'
        default: '.'
        required: false
        type: string

jobs:
  sonar:
    name: sonar qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # setup node.js
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node }}
          cache: 'npm'        
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifactPath }}
      - name: Sonar publish analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  
          SONAR_URL: 'https://sonarcloud.io'
        run: |
          SONAR_KEY="${GITHUB_REPOSITORY//\//_}"   
          OPS="-Dsonar.projectKey=$SONAR_KEY"
          OPS="$OPS -Dsonar.host.url=$SONAR_URL"
          OPS="$OPS -Dsonar.organization=${{ github.repository_owner }}"
          OPS="$OPS -Dsonar.sourceEncoding=UTF-8"
          OPS="$OPS -Dsonar.testExecutionReportPaths=reports/sonarqube_report.xml"
          OPS="$OPS -Dsonar.javascript.lcov.reportPaths=reports/coverage/lcov.info"
          OPS="$OPS -Dsonar.javascript.maximumFunctionParameters=10"
          OPS="$OPS -Dsonar.cpd.javascript.minimumLines=250"
          OPS="$OPS -Dsonar.cpd.javascript.minimumtokens=2500"
          OPS="$OPS -Dsonar.cpd.exclusions=src/**/*.ts,src/**/*.html"
          OPS="$OPS -Dsonar.exclusions=src/app/shared/generated/**/*,pre_loaders/**/*,src/scope-polyfill/*,libs/**/generated/**/*"
          OPS="$OPS -Dsonar.coverage.exclusions=*.ts,*.js,libs/**/src/*.ts,libs/**/generated/**/*,pre_loaders/**/*,src/scope-polyfill/*,src/environments/*,src/assets/**/*,src/*.ts,src/**/*.module.ts,src/**/*.main.ts,src/**/*.bootstrap.ts,src/**/*.harness.ts,src/**/*.selectors.ts,src/app/*.ts,src/app/shared/generated/**/*"
          OPS="$OPS -Dsonar.test.inclusions=src/**/*.spec.ts,libs/**/*.spec.ts"
          OPS="$OPS -Dsonar.issue.ignore.multicriteria=e1,e2"
          OPS="$OPS -Dsonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7059"
          OPS="$OPS -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts"
          OPS="$OPS -Dsonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7785"
          OPS="$OPS -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts"
          npx sonarqube-scanner $OPS -Dsonar.token=${{ secrets.SONAR_TOKEN }}
