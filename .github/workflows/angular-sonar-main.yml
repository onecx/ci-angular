name: sonar

on:
  workflow_call:
    inputs:
      node:
        description: 'Node version'
        default: '20'
        required: false
        type: string

jobs:
  sonar:
    name: sonar qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests with Coverage + Sonar XML report
        run: npm test -- --watch=false --browsers=ChromeHeadless --code-coverage
      - name: Sonar publish analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  
          SONAR_URL: 'https://sonarcloud.io'
        run: |
          SONAR_KEY="${GITHUB_REPOSITORY//\//_}"   
          OPS="-Dsonar.projectKey=$SONAR_KEY"
          OPS="$OPS -Dsonar.host.url=$SONAR_URL"
          OPS="$OPS -Dsonar.organization=${{ github.repository_owner }}"
          OPS="$OPS -Dsonar.sourceEncoding=UTF-8"
          OPS="$OPS -Dsonar.testExecutionReportPaths=./reports/sonarqube_report.xml"
          OPS="$OPS -Dsonar.javascript.lcov.reportPaths=./reports/coverage/lcov.info"          
          OPS="$OPS -Dsonar.javascript.maximumFunctionParameters=10"
          OPS="$OPS -Dsonar.typescript.maximumFunctionParameters=10"
          OPS="$OPS -Dsonar.cdp.javascript.maximumFunctionParameters=10"
          OPS="$OPS -Dsonar.cdp.typescript.maximumFunctionParameters=10"
          OPS="$OPS -Dsonar.javascript.exclusions=src/app/shared/generated/**/*"
          OPS="$OPS -Dsonar.cpd.exclusions=src/**/*.ts"
          OPS="$OPS -Dsonar.coverage.exclusions=*.ts,*.js,src/*.ts,src/**/*.module.ts,src/**/*.main.ts,src/**/*.bootstrap.ts,src/environments/*,src/assets/**/*,src/app/shared/generated/**/*",pre_loaders/**/*,src/scope-polyfill/*
          OPS="$OPS -Dsonar.test.inclusions=src/**/*.spec.ts"
          npx sonarqube-scanner $OPS -Dsonar.token=${{ secrets.SONAR_TOKEN }}
