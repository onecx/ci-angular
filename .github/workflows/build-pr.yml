name: pr

on:
  workflow_call:
    inputs:  
      autoMerge:
        description: 'Auto merge pr'
        default: true
        required: false
        type: boolean

jobs:
  dependency-review:
    uses: onecx/ci-common/.github/workflows/dependency-review.yml@v1
    secrets: inherit
    with:
      failOnSeverity: 'high'
  code-ql:
    uses: onecx/ci-angular/.github/workflows/angular-codeql.yml@v1
    secrets: inherit
  angular:
    uses: onecx/ci-angular/.github/workflows/angular-build.yml@v1
    secrets: inherit
  docker:
    uses: onecx/ci-common/.github/workflows/docker-build.yml@v1
    needs: angular
    secrets: inherit
    with:
      samoDockerFile: Dockerfile
  helm:
    uses: onecx/ci-common/.github/workflows/helm-build.yml@v1
    needs: docker
    secrets: inherit
    with:
      helmDir: 'helm'
  auto-merge:
    if: |
      !cancelled() && needs.helm.result == 'success' && inputs.autoMerge
    uses: onecx/ci-angular/.github/workflows/angular-pr-auto-merge.yml@d1
    needs: [helm]
    secrets: inherit